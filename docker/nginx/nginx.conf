worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Definicja cache w pamięci/na dysku Nginx
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Konfiguracja dla REST (HTTP/1.1)
    server {
        listen 80;
        server_name localhost;

        # Odpowiedzi GET będą cachowane
        location /api/ {
            proxy_pass http://inventory-service:5002;
            
            # Włączenie cache dla tego endpointu
            proxy_cache api_cache;
            proxy_cache_methods GET;
            
            # Cache'uj poprawne odpowiedzi na 10 minut
            proxy_cache_valid 200 10m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            
            # Wymuś cacheowanie niezależnie od tego, co zwraca backend (.NET domyślnie może nie wysyłać Cache-Control)
            proxy_ignore_headers Cache-Control;
            proxy_ignore_headers Expires;
            
            # Nagłówki, żebyśmy wiedzieli czy request trafił w cache (HIT/MISS)
            add_header X-Cache-Status $upstream_cache_status;
        }
    }

    # Konfiguracja dla gRPC (HTTP/2)
    server {
        listen 8080 http2;
        server_name localhost;

        # Nginx wspiera grpc_pass, ale domyślnie requesty gRPC (POST) nie są w ten sam sposób cachowane
        location / {
            grpc_pass grpc://inventory-service:5003;
        }
    }
}
