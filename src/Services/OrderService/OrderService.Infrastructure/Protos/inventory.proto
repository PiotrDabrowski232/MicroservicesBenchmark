syntax = "proto3";

option csharp_namespace = "OrderService.Infrastructure.Protos";

package inventory;

service Inventory {
  rpc ReserveProduct (ReserveRequestMessage) returns (ReserveResponseMessage);
  rpc GetProductsBenchmark (GetProductsRequest) returns (GetProductsResponse);
  rpc GetComplexPayloadBenchmark (GetComplexPayloadRequest) returns (ComplexPayloadResponse);
  rpc GetTransportPing (TransportPingRequest) returns (TransportPingResponse);
}

message ReserveRequestMessage {
  string productId = 1;
  int32 quantity = 2;
}

message ReserveResponseMessage {
  bool success = 1;
  string errorMessage = 2;
}

message GetProductsRequest {
  int32 count = 1;
}

message ProductDtoMessage {
  string id = 1;
  string name = 2;
  double price = 3;
  string description = 4;
}

message GetProductsResponse {
  repeated ProductDtoMessage products = 1;
}

message TransportPingRequest {
}

message TransportPingResponse {
  string message = 1;
  int32 value = 2;
}

message GetComplexPayloadRequest {
  int32 count = 1;
}

message ComplexPayloadResponse {
  repeated ComplexItemMessage items = 1;
}

message ComplexItemMessage {
  string id = 1;
  string name = 2;
  double price = 3;
  ItemCategoryMessage category = 4;
  repeated ItemTranslationMessage translations = 5;
  ItemMetadataMessage metadata = 6;
  repeated ItemReviewMessage reviews = 7;
}

message ItemCategoryMessage {
  string id = 1;
  string name = 2;
  ItemCategoryMessage parentCategory = 3;
}

message ItemTranslationMessage {
  string languageCode = 1;
  string title = 2;
  string description = 3;
}

message ItemMetadataMessage {
  string manufacturer = 1;
  int32 weight = 2;
  bool isAvailable = 3;
  string tags = 4;
}

message ItemReviewMessage {
  string reviewer = 1;
  int32 rating = 2;
  string comment = 3;
  string date = 4;
}
